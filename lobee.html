<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Will You Marry Me? ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff758c,#ff7eb3,#ffb199);
}

.container{
    text-align:center;
}

h1{
    color:white;
    font-size:3rem;
    margin-bottom:30px;
    text-shadow:0 0 15px rgba(255,255,255,0.6);
}

button{
    border:none;
    border-radius:50px;
    padding:15px 35px;
    font-size:22px;
    cursor:pointer;
    margin:10px;
    transition:0.3s;
}

#yesBtn{
    background:#ff3366;
    color:white;
}

#yesBtn:hover{
    transform:scale(1.1);
}

#noBtn{
    background:white;
    position:absolute;
}

#catImage{
    display:none;
    margin-top:25px;
    width:350px;
    max-width:90%;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

#message{
    display:none;
    color:white;
    font-size:2rem;
    margin-top:20px;
    font-weight:bold;
}

.heart{
    position:absolute;
    font-size:30px;
    animation:floatUp 4s linear forwards;
}

@keyframes floatUp{
    from{
        transform:translateY(0);
        opacity:1;
    }
    to{
        transform:translateY(-100vh);
        opacity:0;
    }
}
</style>
</head>

<body>

<div class="container">
    <h1 id="title">💍 Will You Marry Me? 💍</h1>

    <button id="yesBtn">Yes ❤️</button>
    <button id="noBtn">No 😢</button>

    <div id="message">
        YAYYYY!! ❤️🥹💍
    </div>

    <br>

    <img id="catImage"
    src="https://i.pinimg.com/originals/6a/d0/7b/6ad07bc7872b7f4cafc7f14ad7638306.gif"
    alt="Cat Kiss">
</div>

<script>

const noBtn = document.getElementById("noBtn");

function moveButton(){
    const x = Math.random() * (window.innerWidth - 120);
    const y = Math.random() * (window.innerHeight - 80);

    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
}

noBtn.addEventListener("mouseover", moveButton);
noBtn.addEventListener("click", moveButton);

document.getElementById("yesBtn").addEventListener("click", () => {

    document.getElementById("title").innerHTML =
    "💖 You Made Me The Happiest Person 💖";

    document.getElementById("catImage").style.display = "block";
    document.getElementById("message").style.display = "block";

    noBtn.style.display = "none";

    setInterval(() => {

        const heart = document.createElement("div");

        heart.classList.add("heart");

        const hearts = ["❤️","💖","💕","💘","💗"];

        heart.innerHTML =
        hearts[Math.floor(Math.random()*hearts.length)];

        heart.style.left =
        Math.random() * window.innerWidth + "px";

        heart.style.bottom = "-50px";

        document.body.appendChild(heart);

        setTimeout(() => {
            heart.remove();
        },4000);

    },250);
});

</script>

</body>
</html>
